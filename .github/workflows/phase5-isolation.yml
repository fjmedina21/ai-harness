name: Phase 5 dedicated isolation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-dedicated-isolation
  cancel-in-progress: false

jobs:
  isolation:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fjmedina21/ai-harness' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ai-harness-phase5-isolation]
    environment: phase5-isolation
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real Podman isolation gate
        run: pnpm test:isolation
        env:
          HARNESS_ISOLATION_PROFILE: ${{ vars.HARNESS_ISOLATION_PROFILE_PATH }}
