name: Publish documentation to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'fjmedina21/ai-harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Build and validate portal
        run: pnpm docs:check
      - name: Verify Pages configuration (never enable automatically)
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy manually requested site
        id: deployment
        uses: actions/deploy-pages@v4
