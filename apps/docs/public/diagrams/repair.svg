<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" aria-labelledby="title desc"><title id="title">Finite supervised repair state machine</title><desc id="desc">Verified ValidationFailed enters RepairRequested. Analysis and proposal pause for patch approval, apply and sandbox approval, then revalidate. Pass completes; code failure can enter NextIteration within budget. Any nonterminal stage can stop for failure, uncertainty, cancellation, no progress or budget exhaustion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#79d5ba"/></marker></defs><rect width="720" height="840" rx="16" fill="#102c29"/><g font-family="system-ui,sans-serif"><text x="30" y="38" fill="#dcf9ee" font-size="22" font-weight="600">Finite supervised repair</text><text x="30" y="66" fill="#bbded1" font-size="15">Entry: verified ValidationFailed evidence</text><rect x="30" y="90" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="124" fill="#f0fff8" font-size="17">RepairRequested</text><path d="M335 146v28" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="176" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="210" fill="#f0fff8" font-size="17">AnalyzingDiagnostics → RepairProposed</text><path d="M335 232v28" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="262" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="296" fill="#f0fff8" font-size="17">AwaitingPatchApproval · human decision</text><path d="M335 318v28" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="348" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="382" fill="#f0fff8" font-size="17">RepairApproved → ApplyingRepair → RepairApplied</text><path d="M335 404v28" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="434" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="468" fill="#f0fff8" font-size="17">AwaitingSandboxApproval · separate human decision</text><path d="M335 490v28" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="520" width="610" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="48" y="554" fill="#f0fff8" font-size="17">Revalidating</text><path d="M335 576v28H170v30M335 604h165v30" fill="none" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="636" width="275" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="50" y="670" fill="#f0fff8" font-size="18">Completed</text><rect x="365" y="636" width="275" height="56" rx="8" fill="#204a42" stroke="#79d5ba"/><text x="385" y="670" fill="#f0fff8" font-size="18">NextIteration</text><path d="M640 664h40V118h-38" fill="none" stroke="#79d5ba" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="620" fill="#bbded1" font-size="14">code failure, within budget</text><text x="30" y="620" fill="#bbded1" font-size="14">verified pass</text><text x="30" y="742" fill="#dcf9ee" font-size="16">Any active stage may stop:</text><text x="30" y="772" fill="#bbded1" font-size="15">Cancelled · BudgetExhausted · NoProgress · Blocked · Failed</text><text x="30" y="800" fill="#bbded1" font-size="15">ReconciliationRequired — unknown effects never replay</text></g></svg>
