<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">Multi-agent workflow</title><desc id="desc">Sequential roles produce a proposal. A validator role alone does not execute tests.</desc><rect width="720" height="540" rx="16" fill="#102c29"/><text x="36" y="44" fill="#dcf9ee" font-family="system-ui,sans-serif" font-size="22" font-weight="600">Multi-agent workflow</text><rect x="36" y="72" width="648" height="58" rx="9" fill="#204a42" stroke="#79d5ba"/><text x="58" y="108" fill="#f0fff8" font-family="system-ui,sans-serif" font-size="19">01  Host request + finite scope</text><path d="M360 132v19m-5-5 5 5 5-5" fill="none" stroke="#79d5ba" stroke-width="2"/><rect x="36" y="155" width="648" height="58" rx="9" fill="#204a42" stroke="#79d5ba"/><text x="58" y="191" fill="#f0fff8" font-family="system-ui,sans-serif" font-size="19">02  Requirements / architecture</text><path d="M360 215v19m-5-5 5 5 5-5" fill="none" stroke="#79d5ba" stroke-width="2"/><rect x="36" y="238" width="648" height="58" rx="9" fill="#204a42" stroke="#79d5ba"/><text x="58" y="274" fill="#f0fff8" font-family="system-ui,sans-serif" font-size="19">03  Planner + implementer proposal</text><path d="M360 298v19m-5-5 5 5 5-5" fill="none" stroke="#79d5ba" stroke-width="2"/><rect x="36" y="321" width="648" height="58" rx="9" fill="#204a42" stroke="#79d5ba"/><text x="58" y="357" fill="#f0fff8" font-family="system-ui,sans-serif" font-size="19">04  Advisory review + validator</text><path d="M360 381v19m-5-5 5 5 5-5" fill="none" stroke="#79d5ba" stroke-width="2"/><rect x="36" y="404" width="648" height="58" rx="9" fill="#204a42" stroke="#79d5ba"/><text x="58" y="440" fill="#f0fff8" font-family="system-ui,sans-serif" font-size="19">05  Exact human review before effect</text><text x="36" y="514" fill="#bbded1" font-family="system-ui,sans-serif" font-size="14">Implemented composition · see page text for acceptance limits and branches</text></svg>
